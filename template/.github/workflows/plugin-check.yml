name: plugin-check
on:
  pull_request:
    paths: ["Plugins/**", "fo-git.json", "Tools/fo-git.exe"]
  push:
    branches: [main]
    paths: ["Plugins/**", "fo-git.json", "Tools/fo-git.exe"]
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Plugins
            Tools
            fo-git.json
            .gitattributes
          sparse-checkout-cone-mode: false
      - uses: actions/cache@v4
        with:
          path: .fo-git/spriggit-cli
          key: spriggit-${{ hashFiles('fo-git.json') }}
      - name: Check master text
        run: Tools/fo-git.exe check --text
      - name: Build the ESM
        run: Tools/fo-git.exe build-esm
      - name: Check the ESM
        run: Tools/fo-git.exe check --binary --round-trip
